name: release-artifact

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm pack
      - run: shasum -a 256 *.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zhengliang-canteen-mcp-package
          path: |
            *.tgz
            SHA256SUMS.txt
